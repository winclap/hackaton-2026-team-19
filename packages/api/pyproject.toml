[project]
name = "api"
version = "0.1.0"
description = "FastAPI orchestrator: scrape → quick analysis → deep analysis with frontend webhooks"
requires-python = ">=3.13"
dependencies = [
    "analyzer",
    "scraper",
    "fastapi>=0.136.1",
    "httpx>=0.28.0",
    "pandas>=3.0.2",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.46.0",
]

[tool.uv.sources]
analyzer = { path = "../analyzer", editable = true }
scraper = { path = "../scraper", editable = true }
